
name: Build Metin2 Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Build ARM64 APK
        working-directory: r10dev.net OPENGL-ITJA/android
        run: |
          gradle assembleDebug --stacktrace -Pm2abi=arm64-v8a

      - name: Check APK
        working-directory: r10dev.net OPENGL-ITJA/android
        run: |
          find app/build/outputs/apk -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metin2-mobile-arm64-apk
          path: r10dev.net OPENGL-ITJA/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
